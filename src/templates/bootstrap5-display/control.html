<script type="text/x-handlebars-template">

    <div class="mb-3">

        {{#if options.label}}
        <label class="{{#if options.labelClass}}{{options.labelClass}}{{/if}} form-label alpaca-control-label" for="{{id}}">{{{options.label}}}</label>
        {{/if}}

        {{#if options.helpers}}
            {{#compare options.helpersPosition "above"}}
                {{#each options.helpers}}
                    <div class="form-text {{#if options.helperClass}}{{options.helperClass}}{{/if}}">
                        <i class="bi bi-info-circle me-1"></i>
                        {{#showMessage .}}{{/showMessage}}
                    </div>
                {{/each}}
            {{/compare}}
        {{/if}}

        {{#control}}{{/control}}

        {{#if options.helpers}}
            {{#compare options.helpersPosition "below"}}
                {{#each options.helpers}}
                    <div class="form-text {{#if options.helperClass}}{{options.helperClass}}{{/if}}">
                        <i class="bi bi-info-circle me-1"></i>
                        {{#showMessage .}}{{/showMessage}}
                    </div>
                {{/each}}
            {{/compare}}
        {{/if}}

    </div>

</script>
