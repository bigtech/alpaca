<script type="text/x-handlebars-template">

    <div id="{{id}}" class="card card-body bg-light mb-3">
        <div class="row">
            <div class="chooser-panel chooser-panel-unselected col-md-6">
                <div class="chooser-panel-header chooser-filter mb-2">
                    <input type="text" class="form-control form-control-sm" placeholder="Filter..."/>
                </div>
                <div class="chooser-panel-items">

                    {{#if showAllSelections}}

                        {{#each selectOptions}}
                            {{#if filtered}}
                            {{else}}
                            <div class="chooser-item {{#if selected}}disabled{{/if}} d-flex justify-content-between align-items-center mb-1" data-chooser-item-text="{{{text}}}" data-chooser-item-value="{{{value}}}" data-chooser-item-index="{{unselectedIndex}}">
                                <div class="chooser-item-text">{{text}}</div>
                                <div class="chooser-item-buttons">
                                    {{#if selected}}
                                    {{else}}
                                    <button class="btn btn-outline-secondary btn-sm btn-add">
                                        <i class="bi bi-plus-lg"></i>
                                    </button>
                                    {{/if}}
                                </div>
                            </div>
                            {{/if}}
                        {{/each}}

                    {{else}}

                        {{#if unselected.length}}
                            {{#each unselected}}
                                {{#if filtered}}
                                {{else}}
                                    <div class="chooser-item d-flex justify-content-between align-items-center mb-1" data-chooser-item-text="{{{text}}}" data-chooser-item-value="{{{value}}}" data-chooser-item-index="{{@index}}">
                                        <div class="chooser-item-text">{{text}}</div>
                                        <div class="chooser-item-buttons">
                                            <button class="btn btn-outline-secondary btn-sm btn-add">
                                                <i class="bi bi-plus-lg"></i>
                                            </button>
                                        </div>
                                    </div>
                                {{/if}}
                            {{/each}}
                        {{else}}
                            <div class="chooser-item-message text-muted fst-italic">All options have been selected</div>
                        {{/if}}

                    {{/if}}
                </div>
            </div>
            <div class="chooser-panel chooser-panel-selected col-md-6">
                <div class="chooser-panel-header chooser-info mb-2"></div>
                <div class="chooser-panel-items">

                    {{#if selected.length}}
                        {{#each selected}}
                            <div class="chooser-item d-flex justify-content-between align-items-center mb-1" data-chooser-item-text="{{{text}}}" data-chooser-item-value="{{{value}}}" data-chooser-item-index="{{@index}}">
                                <div class="chooser-item-text">{{text}}</div>
                                <div class="chooser-item-buttons btn-group btn-group-sm">
                                    <button class="btn btn-outline-secondary btn-sm btn-remove">
                                        <i class="bi bi-dash-lg"></i>
                                    </button>
                                    <button class="btn btn-outline-secondary btn-sm btn-up {{#if @first}}disabled{{/if}}">
                                        <i class="bi bi-chevron-up"></i>
                                    </button>
                                    <button class="btn btn-outline-secondary btn-sm btn-down {{#if @last}}disabled{{/if}}">
                                        <i class="bi bi-chevron-down"></i>
                                    </button>
                                </div>
                            </div>
                        {{/each}}
                    {{else}}
                        <div class="chooser-item-message text-muted fst-italic">No options have been selected</div>
                    {{/if}}

                </div>
            </div>
        </div>
    </div>

</script>
